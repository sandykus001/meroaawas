<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mero Aawas</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Poppins',sans-serif}
ul{list-style:none}
a{text-decoration:none;color:black}

/* HEADER */
header{
  position:fixed;
  width:100%;
  background:#fff;
  z-index:1000;
}

.navbar{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:15px 40px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
}

.logo img{
  width:60px;
}

.logo-text{
  display:flex;
  flex-direction:column;
}

.logo-title{
  font-weight:700;
  color:#2d5a27;
}

.logo-subtitle{
  font-size:12px;
  letter-spacing:2px;
  color:#2d5a27;
}

/* DESKTOP MENU (UNCHANGED) */
nav ul{
  display:flex;
  gap:30px;
}

/* HERO */
.hero{
  height:100vh;
  background:url("project3.jpg") center/cover;
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  text-align:center;
}

/* WHATSAPP FIX */
.whatsapp img{
  width:55px;
  height:55px;
}

.whatsapp{
  position:fixed;
  bottom:20px;
  right:20px;
}

/* ========================= */
/* MOBILE FIX ONLY */
/* ========================= */

@media (max-width:768px){

  /* STACK MENU CLEANLY */
  nav{
    width:100%;
  }

  nav ul{
    flex-direction:column;
    align-items:center;
    gap:16px;
    padding:20px 0;
  }

  /* SMALL TEXT ADJUST */
  nav a{
    display:inline-block;
    padding:8px 12px;
  }

  /* LOGO SMALL */
  .logo img{
    width:50px;
  }

  .logo-subtitle{
    display:none;
  }

  .navbar{
    padding:15px;
  }
}

</style>
</head>

<body>

<header>
  <div class="navbar">

    <div class="logo">
      <img src="logo.png">
      <div class="logo-text">
        <div class="logo-title">MERO AAWAS</div>
        <div class="logo-subtitle">DESIGN AND BUILDERS</div>
      </div>
    </div>

    <nav>
      <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">About</a></li>
        <li><a href="#">Services</a></li>
        <li><a href="#">Projects</a></li>
        <li><a href="#">Team</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </nav>

  </div>
</header>

<section class="hero">
  <h1>Building Your Dream Home with Trust & Quality</h1>
</section>

<!-- WHATSAPP BUTTON -->
<a href="https://wa.me/9779843906513" class="whatsapp">
  <img src="https://cdn-icons-png.flaticon.com/512/733/733585.png">
</a>

</body>
</html>
